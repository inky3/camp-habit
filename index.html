<html lang="en"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Kanit:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6ecdc;--card:#fffaf0;--ink:#2a2140;--mute:#6b6480;--line:#2a2140;--sun:#f6d35a;--glow:#e8923c;--ok:#2f8f6a;--night:#2a2140;--dusk:#4a5a78;--leaf:#2f6f6a;--leaf2:#285f5b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a33;--card:#2b2646;--ink:#f4e9d8;--mute:#a9a3c0;--line:#4a4470}}
:root[data-theme="dark"]{--bg:#1e1a33;--card:#2b2646;--ink:#f4e9d8;--mute:#a9a3c0;--line:#4a4470}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:88px}
.px{font-family:'Pixelify Sans','Kanit',ui-monospace,monospace}
main{max-width:480px;margin:0 auto;padding:0 16px 16px}
.sky{margin:0 -16px 16px;padding:18px 16px 20px;color:#fff;background:radial-gradient(rgba(42,33,64,.35) 1px,transparent 1.2px) 0 0/4px 4px,linear-gradient(180deg,#2a2140 0%,#4a5a78 45%,#e8923c 100%)}
.sky .row{display:flex;justify-content:space-between;align-items:flex-start}
.sky h1{margin:0;font-size:26px}.sky p{margin:4px 0 0;opacity:.92}
.wallet{display:flex;gap:8px;margin-top:14px}
.chip{background:rgba(255,250,240,.16);border:2px solid rgba(255,250,240,.5);padding:4px 12px;border-radius:999px;font-weight:600}
h2{font-size:19px;margin:22px 0 10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
button,select,input{font:inherit;color:inherit}
button{border:2px solid var(--line);background:var(--sun);color:#2a2140;border-radius:12px;padding:10px 16px;min-height:48px;font-weight:600;cursor:pointer}
button:active{transform:scale(.97)}button.ghost{background:transparent;color:var(--ink)}button:disabled{opacity:.45}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
input,select{width:100%;min-height:48px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px}





.amt{font-weight:700;white-space:nowrap}.amt.up{color:var(--ok)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.seg button{padding:8px 4px;background:transparent;color:var(--ink)}.seg button.on{background:var(--sun);color:#2a2140}
.row2{display:flex;gap:10px;align-items:center;justify-content:space-between}
.mut{color:var(--mute);font-size:15px}
.sea{border:2px solid var(--line);border-radius:14px;padding:12px;background:radial-gradient(rgba(42,33,64,.3) 1px,transparent 1.2px) 0 0/4px 4px,linear-gradient(180deg,#2a2140,#4a5a78 55%,#e8923c)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);border-radius:8px;overflow:hidden;border:2px solid #1b1630}
.t{aspect-ratio:1;font-size:clamp(22px,8vw,36px);display:grid;place-items:center;border:0;border-radius:0;padding:0;min-height:0;background:var(--leaf);color:inherit}
.t:nth-child(odd){background:var(--leaf2)}.t.hl{box-shadow:inset 0 0 0 3px var(--sun)}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 6px}
.tray button{min-width:56px;padding:6px 10px}.tray button.on{background:var(--glow)}
.hero{display:flex;gap:14px;align-items:center}
.li{display:flex;align-items:center;gap:12px}.li .e{width:44px;display:grid;place-items:center}.li .sw{width:32px;height:32px;border:2px solid var(--line);border-radius:8px;margin:6px}
.li .tx{flex:1}.li small{display:block;color:var(--mute)}.li button{min-width:96px}
.perk{color:var(--ok);font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px;gap:2px}
nav button{display:flex;flex-direction:column;align-items:center;gap:0;border:0;background:transparent;color:var(--mute);min-height:56px;padding:4px;font-size:13px}
nav button b{line-height:0;margin-bottom:2px}nav button.on{color:var(--ink);background:var(--sun);color:#2a2140}
#toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);background:var(--night);color:#fff;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;white-space:normal;max-width:88vw;width:max-content;text-align:center;border-radius:16px}
#toast.show{opacity:1}.me{border-color:var(--glow);background:color-mix(in srgb,var(--sun) 30%,var(--card))}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chips button{min-height:44px;min-width:44px;padding:6px 12px;background:transparent;color:var(--ink)}.chips button.on{background:var(--sun);color:#2a2140}
.days{flex-wrap:nowrap}.days button{flex:1;min-width:0;padding:6px 0}.lbl{font-weight:600;margin:14px 0 2px}
.pv{border:2px dashed var(--line);border-radius:12px;padding:10px 12px;margin:14px 0 4px;font-weight:600}
.pvh{margin:0 0 12px}.btns{display:flex;gap:8px}.btns button{min-height:44px;padding:6px 12px}
[hidden]{display:none!important}
.plus{width:48px;height:48px;min-height:0;border-radius:50%;font-size:30px;line-height:1;padding:0;flex:none}
.bd{position:fixed;inset:0;background:rgba(15,12,29,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;border:2px solid var(--line);border-bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.ph{display:flex;justify-content:space-between;align-items:center}.ph h2{margin:0}


.bar{position:relative;display:block;height:6px;border-radius:3px;background:color-mix(in srgb,var(--ink) 15%,transparent);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.bar b{position:absolute;top:0;height:100%;background:var(--sun);transition:width .12s ease-out}
.scrub{display:flex;align-items:center;min-width:96px;height:52px;padding:0 4px;border:2px solid var(--line);border-radius:14px;background:var(--sun);color:#2a2140;font-weight:700;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:ew-resize;overflow:hidden;transition:transform .12s,background .12s}
.scrub:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
.scrub .num{flex:1;text-align:center;overflow:hidden;line-height:1}.scrub .num i{display:inline-block;font-style:normal;font-size:20px}
.scrub .num small{display:block;font-size:11px;font-weight:600;opacity:.7;margin-top:2px}
.scrub .ch{opacity:.7;width:16px;display:grid;place-items:center}
.scrub.drag{background:var(--glow);transform:scale(1.07)}
@keyframes inL{from{transform:translateX(80%);opacity:0}}@keyframes inR{from{transform:translateX(-80%);opacity:0}}
@keyframes pop{50%{transform:scale(.92)}}
.num i.l{animation:inL .13s ease-out}.num i.r{animation:inR .13s ease-out}.scrub.pop{animation:pop .2s}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0}
.wk button{min-height:66px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);color:var(--ink);border-radius:12px;font-size:13px}
.wk button b{font-size:18px}.wk button.on{background:var(--sun);color:#2a2140}.wk button.td{border-width:3px}
.wk i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.25}.wk i.y{opacity:1}
.dots{display:flex;gap:5px;margin-top:7px}.dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--mute);display:block}
.dots i.y{background:var(--ink);border-color:var(--ink)}.dots i.t{outline:2px solid var(--glow);outline-offset:1px}
.pill2{font-size:14px;color:var(--mute);padding:6px 10px;border:2px dashed var(--line);border-radius:999px;white-space:nowrap}
.seg5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 10px}.seg5 button{padding:8px 2px;min-height:44px;font-size:14px;background:transparent;color:var(--ink)}.seg5 button.on{background:var(--sun);color:#2a2140}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .card{margin:0}.stats b{display:block;font-size:28px}
.bars{display:flex;align-items:flex-end;gap:8px;height:100px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--mute);gap:4px}
.bars i{display:block;width:100%;background:var(--glow);border-radius:4px 4px 0 0;min-height:3px}
.swc{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);vertical-align:middle}
.sl{display:flex;align-items:center;gap:10px;margin:6px 0}
.sl .big{font-family:'Pixelify Sans','Kanit',monospace;font-size:34px;min-width:84px;text-align:center;line-height:1}.sl .big small{display:block;font-family:system-ui,'Kanit',sans-serif;font-size:13px;color:var(--mute)}
.sl button{width:48px;height:48px;min-height:0;padding:0;border-radius:50%;font-size:24px;flex:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;border:0;padding:0;min-height:0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--glow) var(--f,0%),color-mix(in srgb,var(--ink) 15%,transparent) var(--f,0%));border:2px solid var(--line)}
input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:color-mix(in srgb,var(--ink) 15%,transparent);border:2px solid var(--line)}
input[type=range]::-moz-range-progress{height:10px;border-radius:5px;background:var(--glow)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-12px;border-radius:50%;background:var(--sun);border:3px solid var(--line)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--sun);border:3px solid var(--line)}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:-6px}
.hab{display:grid;grid-template-columns:44px minmax(0,1fr) auto;column-gap:12px;row-gap:10px;align-items:center;background:var(--card);color:var(--ink);padding:12px 14px;margin-bottom:10px;border-radius:14px;border:2px solid var(--line)}
.hab .ic{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:2px solid var(--line);align-self:start;background:#f6ecdc}
.hab .scrub .num small{color:inherit;margin-top:2px}
.hab .nm{min-width:0;cursor:pointer;border-radius:8px}.hab .nm:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
.hab .nm b{display:block;font-weight:600;line-height:1.25}.hab small{display:block;font-weight:400;color:var(--mute);font-size:14px;margin-top:2px}
.rw{display:inline-flex;align-items:center;gap:4px;font-weight:700;align-self:start;white-space:nowrap;padding-top:2px}.rw.ok{color:var(--ok)}
.ft{grid-column:2/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}.ft .dots{margin:0}
.hab.done{border-color:var(--ok)}.hab.done .ic{background:var(--ok);border-color:var(--ok)}.hab.done .nm b{text-decoration:line-through;opacity:.7}
.acts{display:flex;gap:6px;flex:none;align-items:center}.acts button{min-height:44px;min-width:44px;padding:6px 12px;display:inline-flex;align-items:center;justify-content:center}
.acts .go:disabled{opacity:1;background:var(--card);color:var(--ink)}
.pxi{display:inline-block;vertical-align:middle;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px}
.picker{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);color:var(--ink);text-align:left;padding:8px 12px}.picker span{flex:1}.picker .pxi:last-child{transition:transform .15s}.picker.open .pxi:last-child{transform:rotate(90deg)}
.plist{border:2px solid var(--line);border-radius:12px;margin-top:6px;padding:4px 10px 10px;max-height:46vh;overflow:auto;background:var(--card)}
.plist h3{font-size:13px;color:var(--mute);font-weight:600;margin:10px 0 6px}.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pgrid button{display:flex;align-items:center;gap:8px;background:transparent;color:var(--ink);padding:6px 8px;min-height:48px;text-align:left;font-weight:500;font-size:15px}.pgrid button.on{background:var(--sun);color:#2a2140}
.danger{color:#c0392b!important;border-color:#c0392b!important;width:100%;margin-top:8px}
.isl{position:relative;display:flex;justify-content:center;margin-top:14px;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#2f3f66;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
.lvb{position:absolute;left:8px;top:8px;background:rgba(42,33,64,.8);color:#fffaf0;padding:2px 10px;border-radius:8px;font-size:15px;pointer-events:none}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fffaf0;color:#2a2140;border:2px solid #2a2140;border-radius:10px;padding:6px 10px;font-size:14px;line-height:1.3;width:max-content;max-width:210px;pointer-events:none;box-shadow:3px 3px 0 #2a2140;text-align:center}
.bub span,.bub small{display:block}.bub small{color:#6b6480;margin-top:2px}.bub .res{color:#2f8f4a;font-weight:600}.bub button{pointer-events:auto;margin-top:6px;min-height:40px;padding:4px 14px;width:100%}
.bub b{display:block;font-family:'Pixelify Sans','Kanit',monospace;font-size:15px}
.ibar{display:flex;gap:8px;margin:10px 0}.ibar button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.ibar button.ghost{background:var(--card);color:var(--ink)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 4px}.seg2 button{background:var(--card);color:var(--ink)}.seg2 button.on{background:var(--sun);color:#2a2140}
.lvh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.lvh small{font-size:14px;font-weight:400;color:var(--mute);margin-left:auto}
.si .sh{display:flex;align-items:center;gap:12px}.si .sic{width:48px;height:48px;display:grid;place-items:center;background:#f6ecdc;border:2px solid var(--line);border-radius:12px;flex:none}
.si .sn{flex:1;min-width:0}.si .sn b{display:block}.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.tags i{font-style:normal;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ink)}
.si .sh button{flex:none;min-width:88px;display:inline-flex;align-items:center;justify-content:center;gap:6px}.si .sh button.poor{opacity:.6}
.si .sd{margin:10px 0 0;color:var(--mute);font-size:15px}.si.lock{opacity:.55}.si.lock .sic{filter:grayscale(1)}.si.own{border-color:var(--ok)}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.lk{display:flex;flex-direction:column;align-items:center;gap:6px;margin:0;padding:10px 6px;text-align:center;font-size:14px}.lk.on{border-color:var(--ok)}.lk button{width:100%;min-height:40px;padding:4px;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:4px}.swc.big{width:32px;height:32px}
.cel{position:fixed;inset:0;z-index:40;background:rgba(15,12,29,.6);display:grid;place-items:center;padding:16px}
.conf{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
.cel-c{position:relative;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:380px;box-shadow:5px 5px 0 #2a2140}
.cel-c h2{margin:0 0 10px;font-size:24px;text-align:center}.cel-i{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:2px dashed color-mix(in srgb,var(--line) 30%,transparent)}
.cel-i b{display:block}.cel-i span{color:var(--mute);font-size:15px}.cel-b{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.obpage{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.obin{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 0}
.obin>.obd{margin:4px 0 14px}.obin h2.px{font-size:24px;line-height:1.25}
.obnav{position:sticky;bottom:0;margin-top:auto;padding:16px 0 calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to bottom,transparent,var(--bg) 30%)}
.obin>.obnav{margin-top:auto}.obin .qlist+.obnav,.obin .pgrid+.obnav{margin-top:auto}
.obhero{display:flex;justify-content:center;margin:6vh 0 6px}.obhero svg{width:72px;height:72px}
.qopt .langb,.langb{flex:none!important;width:44px;display:inline-grid;place-items:center;min-width:40px;height:32px;border-radius:8px;border:2px solid var(--line);font-weight:700}
.lseg{display:inline-flex;gap:4px}.lseg button{padding:6px 12px;min-height:0}.obin>.lseg{align-self:flex-end}
body.th{line-height:1.5}body.th .px{letter-spacing:0}
.ob h2{margin:6px 0 6px}.obd{display:flex;gap:6px;justify-content:center}.obd i{width:8px;height:8px;border-radius:50%;background:var(--line);opacity:.3}.obd i.on{opacity:1;background:var(--glow)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}.cal b{font-size:12px;color:var(--mute)}
.cal i{font-style:normal;aspect-ratio:1;display:grid;place-items:center;border-radius:8px;color:var(--mute);border:2px solid transparent}
.cal i.sc{border-color:color-mix(in srgb,var(--line) 35%,transparent)}.cal i.dn{background:var(--ok);color:#fff;border-color:var(--ok)}.cal i.fu{opacity:.35}.cal i.td{outline:2px solid var(--glow);outline-offset:1px}
.badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.badges span{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mute)}
.hrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;color:var(--ink);background:var(--card);font-weight:500;padding:10px 14px}.hrow span{flex:1}.hrow small{display:block;color:var(--mute);font-weight:400}
textarea{width:100%;font:13px/1.4 ui-monospace,monospace;border:2px solid var(--line);border-radius:12px;padding:8px;background:var(--card);color:var(--ink);word-break:break-all}
.av{image-rendering:pixelated;display:block}
.pcard{display:flex;align-items:flex-end;gap:14px;border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin:14px 0 10px;min-height:140px;color:#fffaf0}
.pinfo{padding-bottom:6px;min-width:0}.pinfo b{font-size:26px;display:block;text-shadow:2px 2px 0 #2a2140;overflow-wrap:anywhere}.ptl{display:inline-block;background:rgba(42,33,64,.8);padding:2px 10px;border-radius:999px;font-size:14px;margin-top:4px}
.bsunset{background:radial-gradient(rgba(42,33,64,.3) 1px,transparent 1.2px) 0 0/4px 4px,linear-gradient(180deg,#2a2140,#4a5a78 50%,#e8923c)}
.bday{background:radial-gradient(rgba(42,33,64,.3) 1px,transparent 1.2px) 0 0/4px 4px,linear-gradient(180deg,#4f8fc8,#a8d4f0 62%,#efd08e)}
.bnight{background:radial-gradient(#fffaf0 1px,transparent 1.4px) 3px 5px/23px 19px,radial-gradient(#f6d35a 1px,transparent 1.4px) 11px 13px/31px 27px,linear-gradient(180deg,#0f0c28,#2a2140)}
.bsakura{background:radial-gradient(#e07aa0 1.5px,transparent 2px) 5px 7px/21px 17px,radial-gradient(#fffaf0 1px,transparent 1.4px) 14px 3px/27px 23px,linear-gradient(180deg,#d98aa8,#f3c4d6 60%,#9bc79a)}
.baurora{background:radial-gradient(rgba(255,255,255,.7) 1px,transparent 1.4px) 0 0/27px 23px,linear-gradient(160deg,#0f1a33,#1f6f6a 40%,#7a5ad8 70%,#0f1a33)}
.bgold{background:radial-gradient(rgba(255,250,240,.45) 1px,transparent 1.2px) 0 0/4px 4px,linear-gradient(180deg,#c9822a,#f6d35a 55%,#e8923c)}
.bocean{background:radial-gradient(rgba(255,255,255,.6) 1.5px,transparent 2px) 6px 4px/19px 23px,linear-gradient(180deg,#8fc3e8,#4a7fa8 55%,#2f3f66)}
.bforest{background:radial-gradient(rgba(42,33,64,.3) 1px,transparent 1.2px) 0 0/4px 4px,linear-gradient(180deg,#a8d4a0,#3f8a5e 55%,#234a3a)}
.bcandy{background:radial-gradient(#fffaf0 1.5px,transparent 2px) 4px 6px/17px 15px,linear-gradient(135deg,#f6b4cc,#c8b4f0 50%,#9fdcf0)}
.bretro{background:repeating-linear-gradient(90deg,rgba(255,110,200,.35) 0 2px,transparent 2px 20px) 0 100%/100% 42% no-repeat,linear-gradient(180deg,#1a0f33,#5a1f6a 56%,#f06aa0 58%,#2a1040 60%)}
.lcats{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 4px;scrollbar-width:none}.lcats::-webkit-scrollbar{display:none}
.lcats button{flex:none;min-height:40px;padding:4px 14px;background:var(--card);color:var(--ink);font-size:15px}.lcats button.on{background:var(--sun);color:#2a2140}
.bnm{display:block;width:100%;height:48px;border-radius:8px;border:2px solid var(--line)}.ttl{display:grid;place-items:center;min-height:48px;font-family:'Pixelify Sans','Kanit',monospace;font-size:15px;line-height:1.1;overflow-wrap:anywhere}
.lk.lock{opacity:.6}.lk .req{font-size:12px;color:var(--mute);min-height:40px;display:grid;place-items:center}
.frow{display:flex;align-items:center;gap:12px}.frow .rk{width:18px;font-size:18px}.fav{width:52px;height:52px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.fn{flex:1;min-width:0}.fn b{display:block}.fn small{color:var(--mute)}
.gcard .gcode{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 8px;padding:10px 12px;border:2px dashed var(--line);border-radius:12px}
.gcard .gcode span{font-size:28px;letter-spacing:4px}.amsg{min-height:20px;margin:10px 0 0;text-align:center;color:var(--ink);font-weight:600}
.qlist{display:flex;flex-direction:column;gap:8px;margin:8px 0}.qopt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);color:var(--ink);padding:10px 14px;min-height:56px;font-weight:500}
.qopt span{flex:1;min-width:0}.qopt b{display:block}.qopt small{display:block;color:var(--mute);font-size:14px;font-weight:400}.qopt.on{background:var(--sun);color:#2a2140}.qopt.on small{color:#4a3f5e}
.qopt.plan:not(.on){opacity:.55}.qmsg{background:color-mix(in srgb,var(--ok) 15%,var(--card));border-radius:12px;padding:10px 12px;margin:8px 0 0;font-weight:500}
h3.slot{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:18px 2px 8px}
.ruler{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:6px 0}.ruler button{min-height:44px;padding:0;background:var(--card);color:var(--ink);font-weight:600}.ruler button.on{background:var(--sun);color:#2a2140}
.qopt.plan{padding:0;flex-direction:column;align-items:stretch;gap:0}.qopt.plan .pbody{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;color:inherit;padding:10px 14px 6px;min-height:0;font-weight:500}
.qopt.plan .cue{align-self:flex-start;margin:0 14px 10px 54px;min-height:32px;padding:2px 10px;font-size:13px;border-radius:999px;background:rgba(255,250,240,.7);color:#2a2140;border:2px dashed #2a2140}
.psum{margin:8px 0}.psum ul{margin:8px 0 0;padding-left:18px;color:var(--mute);font-size:14px}.psum li{margin:3px 0}
small.hcue{color:var(--ok)!important;font-weight:600}.whyc{display:flex;gap:8px;align-items:center;margin:-4px 2px 12px;color:var(--mute);font-size:14px;font-style:italic}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const P=[...Array(70)].map(()=>({x:W/2+(Math.random()-.5)*W*.4,y:H*.35,vx:(Math.random()-.5)*3,vy:-Math.random()*3-1,c:cols[Math.random()*6|0],s:Math.random()<.3?2:1}));const t0=performance.now();
