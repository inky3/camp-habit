<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camp Habit</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2a2140">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Kanit:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6ecdc;--card:#fffaf0;--ink:#2a2140;--mute:#6b6480;--line:#2a2140;--sun:#f6d35a;--glow:#e8923c;--ok:#2f8f6a;--night:#2a2140;--dusk:#4a5a78;--leaf:#2f6f6a;--leaf2:#285f5b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1e1a33;--card:#2b2646;--ink:#f4e9d8;--mute:#a9a3c0;--line:#4a4470}}
:root[data-theme="dark"]{--bg:#1e1a33;--card:#2b2646;--ink:#f4e9d8;--mute:#a9a3c0;--line:#4a4470}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:88px}
.px{font-family:'Pixelify Sans','Kanit',ui-monospace,monospace}
main{max-width:480px;margin:0 auto;padding:0 16px 16px}
.sky{margin:0 -16px 16px;padding:18px 16px 20px;color:#fff;background:radial-gradient(rgba(42,33,64,.35) 1px,transparent 1.2px) 0 0/4px 4px,linear-gradient(180deg,#2a2140 0%,#4a5a78 45%,#e8923c 100%)}
.sky .row{display:flex;justify-content:space-between;align-items:flex-start}
.sky h1{margin:0;font-size:26px}.sky p{margin:4px 0 0;opacity:.92}
.wallet{display:flex;gap:8px;margin-top:14px}
.chip{background:rgba(255,250,240,.16);border:2px solid rgba(255,250,240,.5);padding:4px 12px;border-radius:999px;font-weight:600}
h2{font-size:19px;margin:22px 0 10px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
button,select,input{font:inherit;color:inherit}
button{border:2px solid var(--line);background:var(--sun);color:#2a2140;border-radius:12px;padding:10px 16px;min-height:48px;font-weight:600;cursor:pointer}
button:active{transform:scale(.97)}button.ghost{background:transparent;color:var(--ink)}button:disabled{opacity:.45}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
input,select{width:100%;min-height:48px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px}





.amt{font-weight:700;white-space:nowrap}.amt.up{color:var(--ok)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.seg button{padding:8px 4px;background:transparent;color:var(--ink)}.seg button.on{background:var(--sun);color:#2a2140}
.row2{display:flex;gap:10px;align-items:center;justify-content:space-between}
.mut{color:var(--mute);font-size:15px}
.sea{border:2px solid var(--line);border-radius:14px;padding:12px;background:radial-gradient(rgba(42,33,64,.3) 1px,transparent 1.2px) 0 0/4px 4px,linear-gradient(180deg,#2a2140,#4a5a78 55%,#e8923c)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);border-radius:8px;overflow:hidden;border:2px solid #1b1630}
.t{aspect-ratio:1;font-size:clamp(22px,8vw,36px);display:grid;place-items:center;border:0;border-radius:0;padding:0;min-height:0;background:var(--leaf);color:inherit}
.t:nth-child(odd){background:var(--leaf2)}.t.hl{box-shadow:inset 0 0 0 3px var(--sun)}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 6px}
.tray button{min-width:56px;padding:6px 10px}.tray button.on{background:var(--glow)}
.hero{display:flex;gap:14px;align-items:center}
.li{display:flex;align-items:center;gap:12px}.li .e{width:44px;display:grid;place-items:center}.li .sw{width:32px;height:32px;border:2px solid var(--line);border-radius:8px;margin:6px}
.li .tx{flex:1}.li small{display:block;color:var(--mute)}.li button{min-width:96px}
.perk{color:var(--ok);font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px;gap:2px}
nav button{display:flex;flex-direction:column;align-items:center;gap:0;border:0;background:transparent;color:var(--mute);min-height:56px;padding:4px;font-size:13px}
nav button b{line-height:0;margin-bottom:2px}nav button.on{color:var(--ink);background:var(--sun);color:#2a2140}
#toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);background:var(--night);color:#fff;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;white-space:normal;max-width:88vw;width:max-content;text-align:center;border-radius:16px}
#toast.show{opacity:1}.me{border-color:var(--glow);background:color-mix(in srgb,var(--sun) 30%,var(--card))}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chips button{min-height:44px;min-width:44px;padding:6px 12px;background:transparent;color:var(--ink)}.chips button.on{background:var(--sun);color:#2a2140}
.days{flex-wrap:nowrap}.days button{flex:1;min-width:0;padding:6px 0}.lbl{font-weight:600;margin:14px 0 2px}
.pv{border:2px dashed var(--line);border-radius:12px;padding:10px 12px;margin:14px 0 4px;font-weight:600}
.pvh{margin:0 0 12px}.btns{display:flex;gap:8px}.btns button{min-height:44px;padding:6px 12px}
[hidden]{display:none!important}
.plus{width:48px;height:48px;min-height:0;border-radius:50%;font-size:30px;line-height:1;padding:0;flex:none}
.bd{position:fixed;inset:0;background:rgba(15,12,29,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;border:2px solid var(--line);border-bottom:0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.ph{display:flex;justify-content:space-between;align-items:center}.ph h2{margin:0}


.bar{position:relative;display:block;height:6px;border-radius:3px;background:color-mix(in srgb,var(--ink) 15%,transparent);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.bar b{position:absolute;top:0;height:100%;background:var(--sun);transition:width .12s ease-out}
.scrub{display:flex;align-items:center;min-width:96px;height:52px;padding:0 4px;border:2px solid var(--line);border-radius:14px;background:var(--sun);color:#2a2140;font-weight:700;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:ew-resize;overflow:hidden;transition:transform .12s,background .12s}
.scrub:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
.scrub .num{flex:1;text-align:center;overflow:hidden;line-height:1}.scrub .num i{display:inline-block;font-style:normal;font-size:20px}
.scrub .num small{display:block;font-size:11px;font-weight:600;opacity:.7;margin-top:2px}
.scrub .ch{opacity:.7;width:16px;display:grid;place-items:center}
.scrub.drag{background:var(--glow);transform:scale(1.07)}
@keyframes inL{from{transform:translateX(80%);opacity:0}}@keyframes inR{from{transform:translateX(-80%);opacity:0}}
@keyframes pop{50%{transform:scale(.92)}}
.num i.l{animation:inL .13s ease-out}.num i.r{animation:inR .13s ease-out}.scrub.pop{animation:pop .2s}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:14px 0}
.wk button{min-height:66px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);color:var(--ink);border-radius:12px;font-size:13px}
.wk button b{font-size:18px}.wk button.on{background:var(--sun);color:#2a2140}.wk button.td{border-width:3px}
.wk i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.25}.wk i.y{opacity:1}
.dots{display:flex;gap:5px;margin-top:7px}.dots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--mute);display:block}
.dots i.y{background:var(--ink);border-color:var(--ink)}.dots i.t{outline:2px solid var(--glow);outline-offset:1px}
.pill2{font-size:14px;color:var(--mute);padding:6px 10px;border:2px dashed var(--line);border-radius:999px;white-space:nowrap}
.seg5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 10px}.seg5 button{padding:8px 2px;min-height:44px;font-size:14px;background:transparent;color:var(--ink)}.seg5 button.on{background:var(--sun);color:#2a2140}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats .card{margin:0}.stats b{display:block;font-size:28px}
.bars{display:flex;align-items:flex-end;gap:8px;height:100px}.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--mute);gap:4px}
.bars i{display:block;width:100%;background:var(--glow);border-radius:4px 4px 0 0;min-height:3px}
.swc{display:inline-block;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);vertical-align:middle}
.sl{display:flex;align-items:center;gap:10px;margin:6px 0}
.sl .big{font-family:'Pixelify Sans','Kanit',monospace;font-size:34px;min-width:84px;text-align:center;line-height:1}.sl .big small{display:block;font-family:system-ui,'Kanit',sans-serif;font-size:13px;color:var(--mute)}
.sl button{width:48px;height:48px;min-height:0;padding:0;border-radius:50%;font-size:24px;flex:none}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;border:0;padding:0;min-height:0}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--glow) var(--f,0%),color-mix(in srgb,var(--ink) 15%,transparent) var(--f,0%));border:2px solid var(--line)}
input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:color-mix(in srgb,var(--ink) 15%,transparent);border:2px solid var(--line)}
input[type=range]::-moz-range-progress{height:10px;border-radius:5px;background:var(--glow)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-12px;border-radius:50%;background:var(--sun);border:3px solid var(--line)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--sun);border:3px solid var(--line)}
.ticks{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:-6px}
.hab{display:grid;grid-template-columns:44px minmax(0,1fr) auto;column-gap:12px;row-gap:10px;align-items:center;background:var(--card);color:var(--ink);padding:12px 14px;margin-bottom:10px;border-radius:14px;border:2px solid var(--line)}
.hab .ic{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:2px solid var(--line);align-self:start;background:#f6ecdc}
.hab .scrub .num small{color:inherit;margin-top:2px}
.hab .nm{min-width:0;cursor:pointer;border-radius:8px}.hab .nm:focus-visible{outline:3px solid var(--glow);outline-offset:2px}
.hab .nm b{display:block;font-weight:600;line-height:1.25}.hab small{display:block;font-weight:400;color:var(--mute);font-size:14px;margin-top:2px}
.rw{display:inline-flex;align-items:center;gap:4px;font-weight:700;align-self:start;white-space:nowrap;padding-top:2px}.rw.ok{color:var(--ok)}
.ft{grid-column:2/-1;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}.ft .dots{margin:0}
.hab.done{border-color:var(--ok)}.hab.done .ic{background:var(--ok);border-color:var(--ok)}.hab.done .nm b{text-decoration:line-through;opacity:.7}
.acts{display:flex;gap:6px;flex:none;align-items:center}.acts button{min-height:44px;min-width:44px;padding:6px 12px;display:inline-flex;align-items:center;justify-content:center}
.acts .go:disabled{opacity:1;background:var(--card);color:var(--ink)}
.pxi{display:inline-block;vertical-align:middle;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px}
.picker{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);color:var(--ink);text-align:left;padding:8px 12px}.picker span{flex:1}.picker .pxi:last-child{transition:transform .15s}.picker.open .pxi:last-child{transform:rotate(90deg)}
.plist{border:2px solid var(--line);border-radius:12px;margin-top:6px;padding:4px 10px 10px;max-height:46vh;overflow:auto;background:var(--card)}
.plist h3{font-size:13px;color:var(--mute);font-weight:600;margin:10px 0 6px}.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pgrid button{display:flex;align-items:center;gap:8px;background:transparent;color:var(--ink);padding:6px 8px;min-height:48px;text-align:left;font-weight:500;font-size:15px}.pgrid button.on{background:var(--sun);color:#2a2140}
.danger{color:#c0392b!important;border-color:#c0392b!important;width:100%;margin-top:8px}
.isl{position:relative;display:flex;justify-content:center;margin-top:14px;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#2f3f66;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
.lvb{position:absolute;left:8px;top:8px;background:rgba(42,33,64,.8);color:#fffaf0;padding:2px 10px;border-radius:8px;font-size:15px;pointer-events:none}
.bub.dn{transform:translate(-50%,0)}.bub{position:absolute;transform:translate(-50%,-100%);background:#fffaf0;color:#2a2140;border:2px solid #2a2140;border-radius:10px;padding:6px 10px;font-size:14px;line-height:1.3;width:max-content;max-width:210px;pointer-events:none;box-shadow:3px 3px 0 #2a2140;text-align:center}
.bub span,.bub small{display:block}.bub small{color:#6b6480;margin-top:2px}.bub .res{color:#2f8f4a;font-weight:600}.bub button{pointer-events:auto;margin-top:6px;min-height:40px;padding:4px 14px;width:100%}
.bub b{display:block;font-family:'Pixelify Sans','Kanit',monospace;font-size:15px}
.ibar{display:flex;gap:8px;margin:10px 0}.ibar button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.ibar button.ghost{background:var(--card);color:var(--ink)}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0 4px}.seg2:has(>button:nth-child(3)){grid-template-columns:1fr 1fr 1fr}.seg2 button{background:var(--card);color:var(--ink)}.seg2 button.on{background:var(--sun);color:#2a2140}
.lvh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.lvh small{font-size:14px;font-weight:400;color:var(--mute);margin-left:auto}
.si .sh{display:flex;align-items:center;gap:12px}.si .sic{width:48px;height:48px;display:grid;place-items:center;background:#f6ecdc;border:2px solid var(--line);border-radius:12px;flex:none}
.si .sn{flex:1;min-width:0}.si .sn b{display:block}.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.tags i{font-style:normal;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ink)}
.si .sh button{flex:none;min-width:88px;display:inline-flex;align-items:center;justify-content:center;gap:6px}.si .sh button.poor{opacity:.6}
.si .sd{margin:10px 0 0;color:var(--mute);font-size:15px}.si.lock{opacity:.55}.si.lock .sic{filter:grayscale(1)}.si.own{border-color:var(--ok)}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.lk{display:flex;flex-direction:column;align-items:center;gap:6px;margin:0;padding:10px 6px;text-align:center;font-size:14px}.lk.on{border-color:var(--ok)}.lk button{width:100%;min-height:40px;padding:4px;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:4px}.swc.big{width:32px;height:32px}
.cel{position:fixed;inset:0;z-index:40;background:rgba(15,12,29,.6);display:grid;place-items:center;padding:16px}
.conf{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;pointer-events:none}
.cel-c{position:relative;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:18px;padding:18px;width:100%;max-width:380px;box-shadow:5px 5px 0 #2a2140}
.cel-c h2{margin:0 0 10px;font-size:24px;text-align:center}.cel-i{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:2px dashed color-mix(in srgb,var(--line) 30%,transparent)}
.cel-i b{display:block}.cel-i span{color:var(--mute);font-size:15px}.cel-b{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.shead{display:flex;align-items:center;gap:10px;margin:0 0 4px}.shead h2{margin:0}.shead button{min-height:44px;padding:6px 12px}.sett h2:not(.px){margin-top:18px}
.spri{image-rendering:pixelated;display:block}.sic .spri{max-width:48px;max-height:48px;width:auto;height:auto;min-height:28px}.tray .spri{max-height:32px;width:auto}
.rwl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.rwi{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:8px 4px;border:2px dashed var(--line);border-radius:12px;opacity:.75}.rwi.own{border-style:solid;opacity:1;background:rgba(246,211,90,.18)}
.rwi .rws{height:36px;display:flex;align-items:flex-end}.rwi .spri{max-height:34px;width:auto}.rwi:not(.own) .spri{filter:grayscale(1) brightness(.7)}.rwi b{font-size:13px;line-height:1.2}.rwi small{font-size:12px;opacity:.8}.rwi .bar{width:100%;height:5px}.cap{text-transform:capitalize}
.lnk{background:none;border:0;padding:0;min-height:0;color:inherit;text-decoration:underline;font:inherit;box-shadow:none}.cel-i .spri{width:32px;height:auto;flex:none}
.gbtn{min-height:52px;font-size:17px}.ordiv{display:flex;align-items:center;gap:10px;margin:18px 0 4px;color:inherit;opacity:.7;font-size:14px}.ordiv::before,.ordiv::after{content:'';flex:1;border-top:2px dashed var(--line)}
#tour{position:fixed;inset:0;z-index:60}.tspot{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px rgba(20,16,40,.66);border:3px solid var(--acc,#f6d35a);transition:all .25s ease;pointer-events:none}
.tbox{position:fixed;background:var(--card,#fffaf0);border:3px solid var(--ink,#2a2140);border-radius:16px;padding:14px 16px;box-shadow:0 6px 0 rgba(0,0,0,.25);max-width:460px;margin:0 auto;transition:top .25s ease}.tbox h3{margin:2px 0 6px;font-size:20px}.tbox p{margin:0 0 12px;line-height:1.45}
@media (prefers-reduced-motion:reduce){.tspot,.tbox{transition:none}}
.seg4{grid-template-columns:repeat(4,1fr)!important;gap:6px}.seg4 button{padding-left:4px;padding-right:4px;font-size:15px}
.rwnext,button.card{color:var(--ink)}.rwnext{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:0 0 12px;padding:10px 12px}.rwnext .rws{width:40px;display:flex;justify-content:center;align-items:flex-end;height:36px}.rwnext .spri{max-height:34px;width:auto}.rwnext .rwt{flex:1;display:flex;flex-direction:column;gap:2px}.rwnext .rwt small{opacity:.75;font-size:13px}.rwnext .bar{height:6px;margin-top:4px}
.icgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:6px}.icgrid button{min-height:48px;padding:6px;background:var(--card);color:var(--ink);display:grid;place-items:center}.icgrid button.on{background:var(--sun);border-color:var(--ink)}.kind{margin:8px 2px 0;font-size:15px}.bub button+button{margin-top:6px}.bub small{display:block;margin-top:6px;opacity:.75;font-size:12px}
.chips.when button{font-size:15px}
.plot{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:8px}.plot .pi{width:40px;height:40px;display:grid;place-items:center}.plot .pt{flex:1;display:flex;flex-direction:column;gap:2px}.plot .pt small{opacity:.75}.plot .bar{height:6px;margin-top:4px}

const NNAME={oak:'Oak tree',pine:'Pine tree',bush:'Bush',berry:'Berry bush',boulder:'Boulder',stump:'Old stump'},NPRICE={oak:25,pine:25,boulder:15,stump:12,berry:10,bush:8};
const ENCOST={oak:3,pine:3,boulder:2,stump:2,berry:1,bush:1};
const enEarned=()=>{const ids=new Set(S.habits.filter(h=>Q(h).c==='work').map(h=>h.id));return S.hist.filter(e=>e.f&&ids.has(e.h)).length};
const enLeft=()=>Math.max(0,enEarned()-(S.ens||0));
const natRect=n=>{const s=natSpr(n.k),big=n.k==='oak'||n.k==='pine',x=n.x*TS+(TS-s.width)/2+(big?0:n.o),base=(n.y+1)*TS-(big?2:1);return{x,y:base-s.height,w:s.width,h:s.height,base}};
function natHit(mx,my){if(!IS.nat||IS.inside)return null;let best=null,bb=-1;for(const n of IS.nat){if(!NBLK[n.k])continue;const r=natRect(n);if(mx>=r.x&&mx<r.x+r.w&&my>=r.y&&my<r.base&&r.base>bb){best=n;bb=r.base}}return best}
function showNat(n){const r=natRect(n),p=NPRICE[n.k];IS.bub={tx:n.x,ty:n.y,bx:n.x*TS+8,by:r.y,nat:n,h:r.h,t:performance.now(),html:`<b>${NNAME[n.k]}</b><span>You have ${enLeft()} energy. Each finished workout gives 1.</span><button data-a="nclear" data-k="energy" ${enLeft()<ENCOST[n.k]?'disabled':''}>${ico('gym',16)} Use ${ENCOST[n.k]} energy</button><button class="ghost" data-a="nclear" data-k="coins">${ico('coin')} Clear for ${p}</button>`};const b=document.getElementById('bub');if(b){b.innerHTML=IS.bub.html;b.hidden=false}}
const natSpr=k=>IS.spr['n_'+k]||(IS.spr['n_'+k]=NSPR[k]());
function genNature(){const L=IS.iland,R=IRR[IS.lv],occ=new Set();IS.nat=[];IS.nblk=new Uint8Array(MAPN*MAPN);
for(const k in S.pl){const[x0,y0]=k.split(',').map(Number),[fw,fh]=fpOf(S.pl[k]);for(let y=y0-1;y<=y0+fh;y++)for(let x=x0-1;x<=x0+fw;x++)occ.add(x+','+y)}
const trees=[],CL=S.clr||{};for(let ty=1;ty<MAPN-1;ty++)for(let tx=1;tx<MAPN-1;tx++){const l=L[ty*MAPN+tx];if(!l||occ.has(tx+','+ty)||CL[tx+','+ty]||(S.tiles&&S.tiles[tx+','+ty])||(S.fen&&S.fen[tx+','+ty])||(S.farm&&S.farm[tx+','+ty]))continue;const d=Math.hypot(tx-MC+.5,ty-MC+.5),h=hsh(tx*7+3,ty*11+5),h2=hsh(tx*13+1,ty*3+9);let k=null;
if(l===2){if(d>R*(IS.lv?.58:.66)&&h>.84&&L[(ty+1)*MAPN+tx]===2&&!trees.some(([a,b])=>Math.abs(a-tx)<3&&Math.abs(b-ty)<3)){k=h2>.4?'oak':'pine';trees.push([tx,ty])}
else if(d>R*.45&&h>.79&&h<=.84)k=h2>.75?'berry':'bush';else if(d>R*.3&&h<.012)k='boulder';else if(d>R*.45&&h>=.012&&h<.02)k='stump';
else if(h>.6&&h<.66)k='grass';else if(h>.66&&h<.675)k='flowers';else if(h>.5&&h<.51&&d>R*.5)k='shroom'}
else if(l===1){if(h>.95)k='shell';else if(h<.025)k='drift'}
if(!k)continue;IS.nat.push({x:tx,y:ty,k,o:Math.floor(h2*6)-3});if(NBLK[k]){IS.nblk[ty*MAPN+tx]=1;if(k==='bush'||k==='berry'||k==='boulder')occ.add(tx+','+ty)}}}
function drawNature(c,cx,cy,W,H,E){if(!IS.nat||IS.inside)return;const pxT=Math.floor(IS.x/TS),pyT=Math.floor(IS.y/TS);for(const n of IS.nat){const s=natSpr(n.k),big=n.k==='oak'||n.k==='pine',x=Math.round(n.x*TS+(TS-s.width)/2+(big?0:n.o))-cx,base=(n.y+1)*TS-(big?2:n.k==='grass'||n.k==='flowers'||n.k==='shell'||n.k==='drift'||n.k==='shroom'?3+Math.abs(n.o):1),y=base-s.height-cy;
if(x<-s.width||x>W||y<-s.height||y>H+4)continue;
if(!NBLK[n.k]){c.drawImage(s,x,y);continue}
E.push({y:base-1,f:()=>{c.fillStyle='rgba(20,16,50,.22)';const sw=big?16:s.width-4;c.fillRect(x+(s.width-sw)/2,base-cy-2,sw,2);c.fillRect(x+(s.width-sw)/2+2,base-cy-1,sw-4,1);
const behind=big&&IS.y<base&&IS.y>base-s.height+6&&Math.abs(IS.x-(n.x*TS+8))<s.width/2;if(behind){c.globalAlpha=.55;c.drawImage(s,x,y);c.globalAlpha=1}else c.drawImage(s,x,y)}})}}

pakbung:{n:'Morning glory',th:'ผักบุ้ง',sci:'Ipomoea aquatica',seed:15,sell:32,days:2,starter:1,img:'Ipomoea_aquatica.jpg',wen:'Ipomoea_aquatica',wth:'ผักบุ้ง',
 s:[['Water morning glory comes from tropical Asia and grows wild in ponds, canals and rice fields. In Thailand it’s famous as pak bung fai daeng, stir-fried over such high heat that the flames leap up.','ผักบุ้งมีถิ่นกำเนิดในเอเชียเขตร้อน ขึ้นเองตามบ่อ คลอง และนาข้าว ในไทยโด่งดังจากผักบุ้งไฟแดงที่ผัดไฟแรงจนเปลวไฟพุ่ง'],
 ['It grows in water or wet soil, and its hollow stems help it float. Pick the tips and new shoots grow back within weeks, so it’s one of the fastest vegetables you can grow. The leaves give vitamin A, vitamin C and iron.','ขึ้นได้ทั้งในน้ำและดินชื้น ลำต้นกลวงช่วยให้ลอยน้ำได้ เด็ดยอดแล้วจะแตกยอดใหม่ในไม่กี่สัปดาห์ จึงเป็นผักที่โตเร็วที่สุดชนิดหนึ่ง ใบมีวิตามินเอ วิตามินซี และธาตุเหล็ก'],
 ['Cooking: stir-fry with garlic, chili and soybean paste, or eat it fresh with som tam and chili dips. Safety: it isn’t poisonous, but plants from dirty water can carry parasites and soak up pollution, so wash well and cook plants picked from canals or ponds. It’s banned as an invasive weed in parts of the United States.','การทำอาหาร: ผัดกับกระเทียม พริก และเต้าเจี้ยว หรือกินสดกับส้มตำและน้ำพริก ความปลอดภัย: ไม่มีพิษ แต่ผักบุ้งจากแหล่งน้ำสกปรกอาจมีพยาธิและสะสมสารพิษ ควรล้างให้สะอาดและทำให้สุกถ้าเก็บจากคลองหรือบ่อ ในบางรัฐของสหรัฐอเมริกาห้ามปลูกเพราะเป็นวัชพืชรุกราน']]},
chili:{n:'Bird’s eye chili',th:'พริกขี้หนู',sci:'Capsicum annuum',seed:25,sell:60,days:4,starter:1,img:'Capsicum_frutescens_Thai_Burapa.jpg',wen:'Bird%27s_eye_chili',wth:'พริกขี้หนู',
 s:[['Chili peppers come from the Americas, where people in Mexico grew them thousands of years ago. Portuguese traders brought them to Asia in the 1500s, and Thai cooking has never been the same.','พริกมีถิ่นกำเนิดในทวีปอเมริกา ชาวเม็กซิโกปลูกกันมาหลายพันปี พ่อค้าชาวโปรตุเกสนำเข้ามาในเอเชียราวศตวรรษที่ 16 และอาหารไทยก็ไม่เหมือนเดิมอีกเลย'],
 ['A small bushy plant whose tiny fruits point upwards and ripen from green to red. It likes warm, sunny spots. Chilies are high in vitamin C, and their heat comes from a compound called capsaicin.','เป็นไม้พุ่มเล็ก ผลเล็กชี้ขึ้นฟ้า สุกจากสีเขียวเป็นสีแดง ชอบที่อุ่นและแดดจัด พริกมีวิตามินซีสูง และความเผ็ดมาจากสารแคปไซซิน'],
 ['Cooking: the base of chili dips, curry pastes and fish sauce with chilies. Safety: capsaicin burns skin and eyes, so wash your hands after cutting chilies; milk calms the burn better than water. Uses beyond food: capsaicin is used in medicated creams for muscle and nerve pain.','การทำอาหาร: เป็นฐานของน้ำพริก พริกแกง และพริกน้ำปลา ความปลอดภัย: แคปไซซินทำให้ผิวและตาแสบร้อน ล้างมือทุกครั้งหลังหั่นพริก นมช่วยลดความเผ็ดได้ดีกว่าน้ำเปล่า การใช้นอกเหนืออาหาร: แคปไซซินใช้ในครีมบรรเทาปวดกล้ามเนื้อและปลายประสาท']]},
lemongrass:{n:'Lemongrass',th:'ตะไคร้',sci:'Cymbopogon citratus',seed:30,sell:75,days:5,img:'Lemongrass_(Cymbopogon_citratus)_1.jpg',wen:'Cymbopogon_citratus',wth:'ตะไคร้',
 s:[['Lemongrass is a tropical grass from South and Southeast Asia. Its lemon smell comes from citral, the same compound found in lemon peel. With galangal and makrut lime leaves, it’s one of the three herbs of tom yum.','ตะไคร้เป็นหญ้าเขตร้อนจากเอเชียใต้และเอเชียตะวันออกเฉียงใต้ กลิ่นมะนาวมาจากสารซิทรัล ซึ่งพบในผิวมะนาวเช่นกัน ตะไคร้เป็นหนึ่งในสามสมุนไพรของต้มยำ คู่กับข่าและใบมะกรูด'],
 ['It grows in big clumps up to one or two metres tall. You can grow it from a stalk from the market: stand it in water and roots appear. Cooks use the pale lower part of the stem.','ขึ้นเป็นกอใหญ่ สูงได้ถึงหนึ่งหรือสองเมตร ปลูกจากต้นที่ซื้อจากตลาดได้ แค่แช่น้ำไว้ก็จะออกราก ส่วนที่ใช้ทำอาหารคือโคนต้นสีขาว'],
 ['Cooking: bruise the stalks for soups, slice thinly into salads, or brew it as tea. Safety: the plant is safe to eat, but concentrated lemongrass oil can irritate skin. Traditional uses: drunk as a tea to help digestion. Its cousin citronella grass is used in mosquito repellents.','การทำอาหาร: ทุบใส่ต้มยำ ซอยบางใส่ยำ หรือต้มเป็นชา ความปลอดภัย: กินได้อย่างปลอดภัย แต่น้ำมันตะไคร้เข้มข้นอาจระคายเคืองผิว การใช้แบบดั้งเดิม: ดื่มเป็นชาช่วยย่อยอาหาร ส่วนตะไคร้หอมซึ่งเป็นญาติกัน ใช้ทำยากันยุง']]},
galangal:{n:'Galangal',th:'ข่า',sci:'Alpinia galanga',seed:40,sell:100,days:6,img:'Galangal.jpg',wen:'Alpinia_galanga',wth:'ข่า',
 s:[['Galangal is a relative of ginger native to Southeast Asia, especially Indonesia. It gives tom kha gai the “kha” in its name.','ข่าเป็นญาติของขิง มีถิ่นกำเนิดในเอเชียตะวันออกเฉียงใต้ โดยเฉพาะอินโดนีเซีย และเป็นที่มาของคำว่า “ข่า” ในต้มข่าไก่'],
 ['The part we eat is the rhizome, an underground stem with shiny skin and pink buds. It grows in leafy clumps in warm, moist soil. It’s firmer than ginger, with a sharp, piney, citrus taste.','ส่วนที่ใช้คือเหง้า ซึ่งเป็นลำต้นใต้ดิน ผิวมันและมีหน่อสีชมพู ขึ้นเป็นกอในดินชุ่มชื้นและอากาศอุ่น เนื้อแข็งกว่าขิง รสเผ็ดร้อน กลิ่นคล้ายสนและส้ม'],
 ['Cooking: slice it into tom yum and tom kha, or pound it into curry paste. Safety: it isn’t poisonous; slices in soup are woody and usually left on the plate. Traditional uses: Thai and Indonesian folk medicine use it for upset stomachs and for fungal skin rashes.','การทำอาหาร: หั่นใส่ต้มยำและต้มข่า หรือโขลกใส่พริกแกง ความปลอดภัย: ไม่มีพิษ แต่ชิ้นข่าในแกงแข็งเหนียว มักเขี่ยทิ้งไว้ข้างจาน การใช้แบบดั้งเดิม: ตำรายาไทยและอินโดนีเซียใช้แก้ท้องอืดและโรคผิวหนังจากเชื้อรา']]},
eggplant:{n:'Thai eggplant',th:'มะเขือเปราะ',sci:'Solanum melongena',seed:30,sell:75,days:5,img:'Makhuea_-_Thai_eggplant.JPG',wen:'Thai_eggplant',wth:'มะเขือเปราะ',
 s:[['Eggplants were first grown in South and Southeast Asia. The Thai eggplant is a small, round, green-and-white variety, about the size of a golf ball.','มะเขือมีต้นกำเนิดในเอเชียใต้และเอเชียตะวันออกเฉียงใต้ มะเขือเปราะเป็นมะเขือพันธุ์ลูกกลมเล็กสีเขียวสลับขาว ขนาดประมาณลูกกอล์ฟ'],
 ['It grows on a bushy plant with purple flowers and loves the heat. The fruit is crunchy and a little bitter, and gives fibre and antioxidants.','เป็นไม้พุ่ม ดอกสีม่วง ชอบอากาศร้อน ผลกรอบ รสขมเล็กน้อย มีใยอาหารและสารต้านอนุมูลอิสระ'],
 ['Cooking: in green curry, or eaten raw and crunchy with chili dips. Safety: it belongs to the nightshade family, and its leaves and stems contain alkaloids, so only the fruit is eaten. In Thai home cooking, raw eggplant is served beside spicy dips to balance the heat.','การทำอาหาร: ใส่แกงเขียวหวาน หรือกินดิบกรอบๆ กับน้ำพริก ความปลอดภัย: อยู่ในวงศ์มะเขือ ใบและลำต้นมีสารอัลคาลอยด์ จึงกินเฉพาะผล ในบ้านคนไทยนิยมเสิร์ฟมะเขือดิบข้างน้ำพริกเพื่อตัดความเผ็ด']]},
makrut:{n:'Makrut lime',th:'มะกรูด',sci:'Citrus hystrix',seed:60,sell:160,days:8,img:'Kaffir_Lime_(Citrus_hystrix).jpg',wen:'Kaffir_lime',wth:'มะกรูด',
 s:[['Makrut lime is a citrus tree native to tropical Southeast Asia. Its bumpy fruit and “double” leaves, where the leaf stalk looks like a second leaf, make it easy to recognise.','มะกรูดเป็นไม้ตระกูลส้มที่มีถิ่นกำเนิดในเอเชียตะวันออกเฉียงใต้ จำได้ง่ายจากผลผิวขรุขระ และใบที่ดูเหมือนสองใบต่อกัน'],
 ['A small thorny tree. Cooks mostly use the leaves and the rind, because the fruit has little juice and is very sour. An older English name used a word that’s offensive in some countries, so “makrut lime” is preferred.','เป็นไม้ต้นเล็กมีหนาม ส่วนที่ใช้ทำอาหารคือใบและผิว เพราะผลมีน้ำน้อยและเปรี้ยวจัด ชื่อภาษาอังกฤษแบบเก่าใช้คำที่ถือว่าเป็นคำหยาบในบางประเทศ จึงนิยมเรียกว่า makrut lime'],
 ['Cooking: tear the leaves into tom yum and curries, and grate the rind into curry paste. Safety: it isn’t poisonous, but like other citrus peel, its oil on skin in strong sunlight can cause a skin reaction. Traditional uses: the fruit has long been used in Thailand to wash hair and to clean.','การทำอาหาร: ฉีกใบใส่ต้มยำและแกง ขูดผิวใส่พริกแกง ความปลอดภัย: ไม่มีพิษ แต่น้ำมันจากผิวมะกรูด เหมือนผิวส้มชนิดอื่น อาจทำให้ผิวระคายเมื่อโดนแดดจัด การใช้แบบดั้งเดิม: คนไทยใช้ผลมะกรูดสระผมและทำความสะอาดมาแต่โบราณ']]},
